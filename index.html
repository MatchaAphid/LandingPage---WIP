<script>
  const root = document.documentElement;
  const setDesktopScale = () => {
    const availableWidth = document.documentElement.clientWidth;
    const scale = Math.min(1, availableWidth / 1440);
    root.style.setProperty('--desktop-scale', scale.toFixed(4));
  };

  window.addEventListener('resize', setDesktopScale, { passive: true });
  setDesktopScale();

  const revealableImages = [...document.querySelectorAll('.desktop img')];
  let animationFrame;

  const updateScrollFade = () => {
    animationFrame = undefined;

    revealableImages.forEach((image) => {
      const bounds = image.getBoundingClientRect();
      const viewportHeight = window.innerHeight;
      const fadeDistance = Math.max(120, viewportHeight * 0.28);
      const distanceFromCenter = Math.abs(
        bounds.top + (bounds.height / 2) - (viewportHeight / 2)
      );
      const visibility = Math.max(0, Math.min(1, 1 - distanceFromCenter / (viewportHeight / 2 + fadeDistance)));

      image.classList.add('scroll-fade');
      image.style.setProperty('--scroll-opacity', visibility.toFixed(3));
      image.style.setProperty('--scroll-offset', `${((1 - visibility) * 45).toFixed(1)}px`);
    });
  };

  const requestScrollFadeUpdate = () => {
    if (!animationFrame) {
      animationFrame = window.requestAnimationFrame(updateScrollFade);
    }
  };

  window.addEventListener('scroll', requestScrollFadeUpdate, { passive: true });
  window.addEventListener('resize', requestScrollFadeUpdate, { passive: true });
  updateScrollFade();
</script>
